<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R+MCare System — Repair and Maintenance Solutions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23354a5f'/%3E%3Crect y='24' width='32' height='4' fill='%23ffc82e'/%3E%3Ctext x='16' y='19' font-family='Arial' font-weight='700' font-size='11' fill='white' text-anchor='middle'%3ER%2BM%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --shell:#354a5f;--shell2:#2b3c4e;--stripe:#ffc82e;
  --bg:#f5f6f7;--surface:#ffffff;--surface2:#f2f4f5;--border:#d9dde1;--line:#e5e8eb;
  --text:#32363a;--muted:#6a6d70;--primary:#0a6ed1;--primary-h:#0854a0;--onprimary:#fff;
  --pos:#107e3e;--neg:#bb0000;--crit:#df6e0c;
  --nav:#ffffff;--navsel:#e5f0fa;--hover:#f3f8fd;
  --shadow:0 0 0 1px rgba(53,74,95,.08),0 1px 3px rgba(53,74,95,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--shell:#1f2933;--shell2:#18212a;--bg:#1b2229;--surface:#26303a;--surface2:#212a33;--border:#3b4754;--line:#33404c;
  --text:#eef1f4;--muted:#a3afbb;--primary:#4aa3f0;--primary-h:#2f8be0;--onprimary:#0b1724;--pos:#4cc27a;--neg:#ff6b6b;--crit:#ffad5a;
  --nav:#212a33;--navsel:#1c3a57;--hover:#2c3844;--shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  color-scheme:dark;--shell:#1f2933;--shell2:#18212a;--bg:#1b2229;--surface:#26303a;--surface2:#212a33;--border:#3b4754;--line:#33404c;
  --text:#eef1f4;--muted:#a3afbb;--primary:#4aa3f0;--primary-h:#2f8be0;--onprimary:#0b1724;--pos:#4cc27a;--neg:#ff6b6b;--crit:#ffad5a;
  --nav:#212a33;--navsel:#1c3a57;--hover:#2c3844;--shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"72","72full","Segoe UI",Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;color:var(--text);background:var(--bg)}
a{color:var(--primary);text-decoration:none}
svg.i{fill:currentColor;flex-shrink:0;vertical-align:middle}
button{font:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
#app{height:100%}

/* Shell bar */
.shell{height:46px;background:var(--shell);color:var(--shtext,#fff);display:flex;align-items:center;gap:6px;padding:0 8px;position:relative;z-index:50;border-bottom:3px solid var(--stripe)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 4px;font-size:15px}
.brand .logo{height:28px;padding:0 7px;border-radius:4px;background:#fff;color:var(--shell);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px}
.brand img{height:28px;max-width:110px;object-fit:contain;border-radius:3px;background:#fff;padding:2px}
.cmd{display:flex;align-items:center;background:var(--shfield,rgba(255,255,255,.14));border-radius:4px;height:30px;padding:0 6px;gap:2px;margin-left:8px}
.cmd input{background:transparent;border:0;color:inherit;width:96px;outline:none;font:inherit;font-size:13px;text-transform:uppercase}
.cmd input::placeholder,.ssearch input::placeholder{color:inherit;opacity:.6;text-transform:none}
.sp{flex:1}
.ssearch{display:flex;align-items:center;background:var(--shfield,rgba(255,255,255,.14));border-radius:16px;height:30px;padding:0 10px;gap:6px;width:260px}
.ssearch input{background:transparent;border:0;color:inherit;outline:none;width:100%;font:inherit;font-size:13px}
.sbtn{background:transparent;border:0;color:inherit;height:36px;min-width:36px;border-radius:6px;display:grid;place-items:center;cursor:pointer;padding:0 4px}
.sbtn:hover{background:var(--shfield,rgba(255,255,255,.14))}
.avatar{width:30px;height:30px;border-radius:50%;background:#d1e8ff;color:#0a4a8a;display:grid;place-items:center;font-weight:700;font-size:12px}
.avatar.lg{width:44px;height:44px;font-size:16px}
.net{font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;opacity:.92}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#4cc27a}
.net.off::before{background:#ffad5a}
.savest{font-size:12px;opacity:.8;white-space:nowrap}
.clock{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:baseline;padding:0 6px;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
.clock b{font-size:14px;font-weight:700;letter-spacing:.3px}
.savebtn{display:inline-flex!important;align-items:center;gap:6px;background:var(--stripe)!important;color:#1d2d3e!important;font-weight:700;height:30px!important;padding:0 12px!important;border-radius:4px!important;font-size:13px;position:relative}
.savebtn:hover{filter:brightness(1.06)}
.savebtn.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#e34b4b;border:2px solid var(--shell)}
.nsr{display:flex;align-items:center}
.nsr .nsh{flex:1}
.nadd{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:4px;margin-right:8px;display:grid;place-items:center}
.nadd:hover{background:var(--hover);color:var(--primary)}
.chart .tgt{stroke:#d0021b;stroke-width:1.5;stroke-dasharray:6 4}
.layout{display:flex;height:calc(100% - 46px)}
.nav{width:256px;background:var(--nav);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:6px 0 20px}
.main{flex:1;overflow:auto;min-width:0;position:relative}
.nl{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 18px;color:var(--text);font-size:13.5px;border-left:3px solid transparent}
.nl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl small{font-size:10.5px;color:var(--muted);font-family:Consolas,monospace}
.nl:hover{background:var(--hover)}
.nl.on{background:var(--navsel);border-left-color:var(--primary);color:var(--primary);font-weight:600}
.nsh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 14px;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
.nsh span{flex:1}
.nsh:hover{color:var(--text)}
.nsec.col .nsb{display:none}
.nsec.col .nsh svg:last-child{transform:rotate(-90deg)}
.nsb .nl{padding-left:26px}
.navfoot{padding:16px 18px 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px}

/* Page */
.phead{background:var(--surface);padding:12px 24px 0;border-bottom:1px solid var(--border)}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--primary)}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.ptitle h1{font-size:21px;font-weight:600;margin:0}
.tcode{font-size:11px;background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:3px;color:var(--muted);font-family:Consolas,monospace}
.psub{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0 10px}
.content{padding:16px 24px 40px;max-width:1600px}
.card{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h3{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:600}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ch h3{margin:0}
.btn{height:32px;padding:0 12px;border:1px solid var(--primary);color:var(--primary);background:var(--surface);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.em{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.btn.em:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.neg{border-color:var(--neg);color:var(--neg)}
.btn.ghost.neg{border-color:transparent}
.btn.sm{height:28px;padding:0 8px}
.btn.xs{height:26px;padding:0 5px}
.btn.full{width:100%;justify-content:center;height:38px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--primary);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--primary);padding:0 10px;height:30px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.seg button.on{background:var(--primary);color:var(--onprimary)}
.inp{height:32px;border:1px solid #89919a;border-radius:4px;padding:0 8px;background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:6px 8px;resize:vertical}
select.inp{padding-right:4px}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.inp[readonly]{background:var(--surface2);border-style:dashed}
.inp.w-auto{width:auto}
.lbl{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.req::after{content:" *";color:var(--neg)}
.ro{min-height:32px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line);word-break:break-word;white-space:pre-wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 24px}
.span-2{grid-column:span 2}.span-all{grid-column:1/-1}
.sep{font-weight:600;border-top:1px solid var(--line);padding-top:10px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fbar .fi{min-width:150px;flex:0 1 190px}
.fbar .fi.grow{flex:1 1 240px}
.mt{margin-top:10px}.muted{color:var(--muted)}.small{font-size:12px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.msg{padding:10px 12px;border-radius:4px;margin-bottom:12px;font-size:13.5px;border-left:4px solid var(--primary);background:var(--navsel)}
.msg.err{border-color:var(--neg);background:rgba(187,0,0,.08)}
.msg.ok{border-color:var(--pos);background:rgba(16,126,62,.08)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:4px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:var(--surface2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;color:var(--muted)}
.tbl th[onclick]{cursor:pointer}
.tbl th[onclick]:hover{color:var(--text)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr{cursor:pointer}
.tbl.static tbody tr{cursor:default}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--navsel)}
.tbl tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--border)}
.tbl td.ck,.tbl th.ck{width:34px;text-align:center}
.tbl td.acts{text-align:right}
.tbl tr.grp td{background:var(--surface2);font-weight:600}
.tbl .c{text-align:center}
.tbl input.inp{height:28px}
.st{font-weight:600}.st.pos{color:var(--pos)}.st.neg{color:var(--neg)}.st.crit{color:var(--crit)}
.lvh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px}

/* Tabs */
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;color:var(--text);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--primary)}
.tab.on{border-color:var(--primary);color:var(--primary);font-weight:600}

/* Dashboard */
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.w{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:150px;border-top:3px solid var(--kc,var(--primary))}
.w.s1{grid-column:span 1}.w.s2{grid-column:span 2}.w.s3{grid-column:span 3}.w.s4{grid-column:span 4}
.wh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;gap:6px;min-height:34px}
.wtt{font-size:13.5px;font-weight:600}
.wtools{display:flex;gap:2px}
.wb{padding:8px 14px 14px;flex:1;min-width:0}
.dgrid.editing .w{outline:2px dashed var(--border);outline-offset:2px}
.kpi{cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.kpi .val{font-size:32px;font-weight:300;color:var(--kc,var(--primary));line-height:1.15;word-break:break-word}
.kpi .val.st{font-weight:400}
.kl{font-size:12px;color:var(--muted);margin-top:4px}
.prog{position:relative;height:6px;background:var(--surface2);border-radius:3px;margin-top:8px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--kc,var(--primary));border-radius:3px}
.prog b{position:absolute;top:-4px;width:2px;height:14px;background:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:110px;background:var(--surface)}
.tile:hover{border-color:var(--primary);background:var(--hover)}
.tile .tt{font-size:13px;font-weight:600}
.tile .tc{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;color:var(--primary)}
.tile .tc span{font-size:26px;font-weight:300}
.tile small{color:var(--muted);font-family:Consolas,monospace;font-size:10.5px}
.note img{max-width:100%;max-height:220px;border-radius:4px;display:block;margin-bottom:8px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart .zero{stroke:var(--muted)}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .pv{fill:var(--text);font-size:19px;font-weight:700}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie-svg{width:180px;max-width:46%}
.legend{flex:1;min-width:140px;font-size:12.5px}
.legend div{display:flex;gap:6px;align-items:center;margin:3px 0}
.legend i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Attachments */
.drop{border:2px dashed var(--border);border-radius:6px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.drop:hover,.drop.ov{border-color:var(--primary);background:var(--hover);color:var(--text)}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.att{border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--surface)}
.att img,.att .th{width:100%;height:104px;object-fit:cover;display:grid;place-items:center;background:var(--surface2);cursor:zoom-in;color:var(--muted)}
.att .an{font-size:12px;padding:6px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .aa{display:flex;align-items:center;justify-content:space-between;padding:0 4px 4px 8px;color:var(--muted)}
.ib{border:0;background:none;color:var(--primary);cursor:pointer;padding:4px;border-radius:4px}
.ib:hover{background:var(--hover)}

/* Gantt */
.gsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.gsel select{width:auto}
.gantt{border:1px solid var(--border);border-radius:4px;background:var(--surface);overflow:auto}
.grw{display:grid;grid-template-columns:220px 1fr;min-width:760px;border-bottom:1px solid var(--line)}
.ghead{background:var(--surface2);font-weight:600;font-size:12px;color:var(--muted)}
.glab{padding:7px 10px;border-right:1px solid var(--border);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;cursor:pointer}
.glab small{display:block;color:var(--muted);font-size:11px}
.gtrack{position:relative;min-height:40px}
.gm{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;padding:4px;color:var(--muted);white-space:nowrap;overflow:hidden}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--neg);opacity:.6}
.gbar{position:absolute;top:9px;height:22px;border-radius:4px;background:var(--primary);color:#fff;font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;min-width:6px;user-select:none}
.gbar.pos{background:#2b9a5b}.gbar.neg{background:#c0392b}.gbar.crit{background:#e9730c}

/* Dialog, toast, popover */
.ovl{position:fixed;inset:0;background:rgba(20,30,40,.45);display:grid;place-items:center;z-index:100;padding:16px}
.dlg{background:var(--surface);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:92vh;display:flex;flex-direction:column;width:100%}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px}
.dlg-b{padding:16px;overflow:auto}
.dlg-f{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface2);border-radius:0 0 8px 8px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#32363a;color:#fff;padding:10px 18px;border-radius:6px;z-index:300;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:#a20000}.toast.ok{background:#0e6b35}
.popover{position:fixed;top:52px;right:8px;background:var(--surface);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:120;width:290px;padding:6px 0}
.popover .uhead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.popover button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 14px;color:var(--text);cursor:pointer;text-align:left;font-size:13.5px}
.popover button:hover{background:var(--hover)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--shell);background-image:linear-gradient(180deg,var(--shell) 0 62%,var(--bg) 62%)}
.lbox{width:min(400px,100%);background:var(--surface);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:28px;border-top:5px solid var(--stripe)}
.lhead{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.lhead img{height:46px;max-width:120px;object-fit:contain}
.lmark{height:46px;padding:0 10px;border-radius:6px;background:var(--shell);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.lhead h1{font-size:20px;margin:0}
.lhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.lerr{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}
.lhint{font-size:12px;color:var(--muted);margin-top:14px;padding:8px 10px;background:var(--surface2);border-radius:4px}
.lfoot{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--muted)}
.lfoot .net::before{background:var(--pos)}

.kv th{text-align:left;width:32%;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.kv td{padding:6px 8px;border-bottom:1px solid var(--line)}
.danger{border-left:4px solid var(--neg)}
.danger .btn{margin-right:6px}

/* ---- Gaya CMMS modern (Cryotos-style) ---- */

  const eqm = d.modules.find(m => m.id === 'equip'), out = [], now = new Date().toISOString(); if (!eqm) return out;
  const R = Math.random, rint = (a, b) => Math.floor(a + R() * (b - a + 1)); let n = 1;
  (d.records.equip || []).forEach(e => {
    const u = e[eqm.titleField]; if (!u) return;
    const sm = (d.records.smr || []).filter(r => r.unit === u && r.smr).sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));
    let hi = sm.length ? +sm[sm.length - 1].smr : rint(15000, 30000), lo = sm.length ? +sm[0].smr - (+sm[0].jam_operasi || 450) : hi - 2800;
    const d0 = sm.length ? parseD(sm[0].tanggal) : new Date(Date.now() - 180 * 864e5), d1 = sm.length ? parseD(sm[sm.length - 1].tanggal) : new Date(); d0.setDate(1);
    const dateAt = s => { const f = hi > lo ? (s - lo) / (hi - lo) : 0; return isoD(new Date(d0.getTime() + Math.max(0, Math.min(1, f)) * (d1 - d0))); };
    for (let p = Math.ceil(lo / 250) * 250; p <= hi + 250; p += 250) {
      const jenis = p % 2000 === 0 ? 'PS 2000' : p % 1000 === 0 ? 'PS 1000' : p % 500 === 0 ? 'PS 500' : 'PS 250', done = p <= hi;
      const dev = R() < .8 ? rint(-20, 22) : rint(30, 95), act = done ? p + dev : '';

    }

}

/* Perhitungan KPI */
function kpiCtx() { const c = DB.kpi, eqm = modById(c.eq.m), eqMap = new Map(); if (eqm) recs(eqm.id).forEach(r => eqMap.set(String(r[c.eq.key]), r)); return { c, eqMap }; }

let DIRTY = false, FILE_HANDLE = null;
const isLocalUse = () => !ONLINE && (location.protocol === 'file:' || !navigator.onLine);

setInterval(tick, 1000);
function updateSaveBtn() { const b = $('#saveBtn'); if (!b) return; b.style.display = isLocalUse() ? '' : 'none'; b.classList.toggle('dirty', DIRTY); b.title = DIRTY ? 'Ada perubahan yang belum disimpan ke file (Ctrl+S)' : 'Simpan data ke file HTML (Ctrl+S)'; }
function markDirty() { DIRTY = true; updateSaveBtn(); }
function buildSelfHTML(d = DB) { const json = JSON.stringify(d).replace(/</g, '\\u003c'); return ORIGINAL_HTML.replace(/(<script type="application\/json" id="rmc-embedded">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b); }
async function saveFile() {
  if (!CUR) return; clearTimeout(saveTimer);
  audit('SAVE', 'Simpan ke file HTML'); DB.meta.updatedAt = new Date().toISOString(); DB.meta.lastFileSave = DB.meta.updatedAt;
  const ok = await Store.set('db', DB); setSaveState(ok && Store.ok ? 'ok' : 'mem');
  const html = buildSelfHTML(), blob = new Blob([html], { type: 'text/html' });
  let name = decodeURIComponent((location.protocol === 'file:' ? location.pathname.split('/').pop() : '') || '') || `${safeFile(DB.meta.appTitle)}.html`; if (!/\.html?$/i.test(name)) name += '.html';
  if (window.showSaveFilePicker && window.top === window.self) {
    try {
      if (!FILE_HANDLE) FILE_HANDLE = (await Store.get('fileHandle')) || null;
      if (FILE_HANDLE && FILE_HANDLE.queryPermission) { let p = await FILE_HANDLE.queryPermission({ mode: 'readwrite' }); if (p !== 'granted') p = await FILE_HANDLE.requestPermission({ mode: 'readwrite' }); if (p !== 'granted') FILE_HANDLE = null; }
      if (!FILE_HANDLE) { FILE_HANDLE = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'File HTML R+MCare', accept: { 'text/html': ['.html', '.htm'] } }] }); try { await Store.set('fileHandle', FILE_HANDLE); } catch (_) {} }
      const w = await FILE_HANDLE.createWritable(); await w.write(blob); await w.close();
      DIRTY = false; updateSaveBtn(); toast(`Tersimpan ke file ${FILE_HANDLE.name}`, 'ok'); return;
    } catch (e) { if (e && e.name === 'AbortError') return; console.warn('Simpan langsung gagal, beralih ke unduhan', e); FILE_HANDLE = null; }
  }
  download(blob, name); DIRTY = false; updateSaveBtn(); toast('File HTML + data diunduh. Gunakan file ini menggantikan file lama.', 'ok');

function mergePkg(pkg) {
  const res = { add: 0, upd: 0, skip: 0, del: 0, mods: 0, user: false }, owner = pkg.from.username;

  });

async function rootDel(id) {

function oItems() {

/* Membuat bagan dari data karyawan */
const ORG_RULES = [[/asset management manager|\bamm\b|manager/i, ''], [/service coordinator|transport coordinator|tata usaha|\bktu\b|planner|quality control|trainer/i, 'AMM'], [/chief mechanic|warehouse assistant/i, 'Service Coordinator'], [/mechanic|mehanic|tukang (las|bubut|body|ban|cuci)|operator tire/i, 'Chief Mechanic HE'], [/operator fuel/i, 'Chief Mechanic DT'], [/krani transport|supir|mandor cpo/i, 'Transport Coordinator'], [/regional scheduler|scheduler/i, 'Planner'], [/krani|kasir|satpam|office boy|tukang air/i, 'Koordinator Tata Usaha']];
function orgFromData(name, filt) {
  const sm = orgSrcMod(), c = { id: uid('oc'), name, nodes: [], style: defOrgStyle() }; if (!sm) return c;
  const rows = recs(sm.id).filter(r => !filt || Object.entries(filt).every(([k, v]) => !v || String(r[k] || '') === v));
  rows.forEach(r => { const t = String(r.kode || r[sm.titleField] || '').replace(/\s*›\s*/g, ' / '); c.nodes.push({ id: uid('o'), p: '', rid: r._id, title: t, name: String(r.nama || ''), phone: r.telepon || '', email: r.email || '', _t: t }); });
  const find = key => c.nodes.find(n => n._t.toLowerCase().includes(key.toLowerCase()));
  c.nodes.forEach(n => { const rule = ORG_RULES.find(([re]) => re.test(n._t)); if (!rule || !rule[1]) return; let p = find(rule[1]); if (!p && /Chief Mechanic/.test(rule[1])) p = find('Chief Mechanic') || find('Service Coordinator'); if (!p) p = c.nodes.find(x => ORG_RULES[0][0].test(x._t)); if (p && p !== n) n.p = p.id; });
  const roots = oKids(c, ''); if (roots.length > 1) { const top = roots.find(n => ORG_RULES[0][0].test(n._t)) || roots[0]; roots.forEach(n => { if (n !== top) n.p = top.id; }); }
  c.nodes.forEach(n => { delete n._t; const k = oKids(c, n.id); n.lay = !n.p ? 'h' : 'v'; if (k.length && oLevel(c, n) >= 1) n.lay = 'v'; });
  orgAutoLayout(c); return c;
}
